# Refreshes the site's data every month and publishes it to geographyarcade.com.
# Fresh data (populations, capitals, divisions, names, maps) comes from Wikidata, geoBoundaries,
# OpenStreetMap and Natural Earth; scripts/guard.js blocks publishing if the new data looks
# broken, and GitHub emails the repository owner when a run fails. Run it by hand from the
# Actions tab ("Run workflow") at any time.
name: Monthly data update

on:
  schedule:
    - cron: '0 2 1 * *' # 02:00 UTC on the 1st of every month (07:00 in Pakistan)
  workflow_dispatch:
  push: # a change to the site's code or settings: rebuild and publish
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', '**.md']

permissions:
  contents: write # to save this month's data back to the repository

concurrency: monthly-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Keep last month's data for comparison
        run: mkdir -p /tmp/baseline && cp data/*.json /tmp/baseline/

      - name: Download fresh data
        run: npm run fetch

      - name: Hold back suspicious name changes (vandalism, glitches)
        run: node scripts/stabilize.js /tmp/baseline

      - name: Check the new data (stops here if something looks broken)
        run: node scripts/guard.js /tmp/baseline

      - name: Build the site
        run: npm run build

      - name: Check every page
        run: npm run check

      - name: Pack the site
        run: npm run zip

      - name: Publish to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN_GEOGRAPHY }}
        run: node scripts/deploy.js

      - name: Tell Bing about the pages
        run: node scripts/indexnow.js
        continue-on-error: true

      - name: Save this month's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/division-flags
          git diff --cached --quiet || git commit -m "Monthly data update $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this ran: put the data commit on top of it. This commit
          # holds only data files, so where both sides changed one (data/lastmod.json after a code
          # push), keep this run's version: it matches the site that was just published.
          git pull --rebase -X theirs -q
          git push || { git pull --rebase -X theirs -q && git push; }
