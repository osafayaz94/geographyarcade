# Refreshes the site's data every month and publishes it to geographyarcade.com.
# Fresh data (populations, capitals, divisions, names, maps) comes from Wikidata, geoBoundaries,
# OpenStreetMap and Natural Earth; scripts/guard.js blocks publishing if the new data looks
# broken, and GitHub emails the repository owner when a run fails. Run it by hand from the
# Actions tab ("Run workflow") at any time.
name: Monthly data update

on:
  schedule:
    - cron: '0 2 1 * *' # 02:00 UTC on the 1st of every month (07:00 in Pakistan)
  workflow_dispatch:
  push: # a change to the site's code or settings: rebuild and publish
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', '**.md']

permissions:
  contents: write # to save this month's data back to the repository

concurrency: monthly-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A push (code or settings change) only rebuilds and publishes, in about 10 minutes: it reuses
      # the map shapes (data/geo/, 183 MB, not in the repository) saved by the last full run.
      # The monthly run, a manual run, or a push with no saved shapes downloads everything (about
      # an hour) and saves the shapes for the next pushes.
      - name: Restore the map shapes from the last full run
        id: geo
        uses: actions/cache/restore@v4
        with:
          path: data/geo
          key: geo-${{ github.run_id }}
          restore-keys: geo-

      - name: Full data refresh or quick rebuild?
        id: mode
        # A push whose commit message contains "[full data]" also runs the full refresh.
        run: echo "full=${{ github.event_name != 'push' || steps.geo.outputs.cache-matched-key == '' || contains(github.event.head_commit.message, '[full data]') }}" >> "$GITHUB_OUTPUT"

      - name: Keep last month's data for comparison
        if: steps.mode.outputs.full == 'true'
        run: mkdir -p /tmp/baseline && cp data/*.json /tmp/baseline/

      - name: Download fresh data
        if: steps.mode.outputs.full == 'true'
        run: npm run fetch

      - name: Hold back suspicious name changes (vandalism, glitches)
        if: steps.mode.outputs.full == 'true'
        run: node scripts/stabilize.js /tmp/baseline

      - name: Check the new data (stops here if something looks broken)
        if: steps.mode.outputs.full == 'true'
        run: node scripts/guard.js /tmp/baseline

      - name: Save the map shapes for quick rebuilds
        if: steps.mode.outputs.full == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/geo
          key: geo-${{ github.run_id }}

      - name: Build the site
        run: npm run build

      # PDF downloads of the printable maps (worksheet + answer key). Cached by page content, so a
      # run only prints the pages that changed.
      - name: Restore the printable PDFs
        uses: actions/cache/restore@v4
        with:
          path: .cache/pdf
          key: pdf-${{ github.run_id }}
          restore-keys: pdf-

      - name: Make the printable PDFs
        run: node scripts/make-pdfs.js

      - name: Save the printable PDFs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/pdf
          key: pdf-${{ github.run_id }}

      # After the PDFs, so the check also confirms every "Download PDF" link has its file.
      - name: Check every page
        run: npm run check

      # rsync over SSH, like salaahdaily.com on the same Hostinger account: only changed files are
      # sent, so there is no archive size limit (Hostinger's archive deploy failed above ~85 MB).
      - name: Publish to Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_GEOGRAPHY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's public host keys (ssh-keyscan, 2026-09-30): refuse to connect to anything else.
          cat > ~/.ssh/known_hosts <<'EOF'
          [145.79.31.12]:65002 ssh-rsa 
          [145.79.31.12]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBANlp6jvxckanGKdGruPFf15aZkstbuGRLp35mN5Pne51l6MK5wayO76VvuVfMeZsHEV3Du1F5zh4wXdVfTSyXU=
          [145.79.31.12]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBV4VmAbo49lntkQd9tInPKGZhsVu4jVdfxxL07gWN/2
          EOF
          sed -i 's/^ *//' ~/.ssh/known_hosts
          # Pages removed from the build are removed from the server; .well-known/ (SSL checks) is never touched.
          rsync -rlz --checksum --delete-after --filter='P .well-known/' \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ u320645487@145.79.31.12:domains/geographyarcade.com/public_html/
          rm -f ~/.ssh/deploy_key

      - name: Clear the Hostinger cache
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN_GEOGRAPHY }}
        run: node scripts/deploy.js --cache-only
        continue-on-error: true

      - name: Tell Bing about the pages
        run: node scripts/indexnow.js
        continue-on-error: true

      - name: Save this month's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/division-flags
          git diff --cached --quiet || git commit -m "Monthly data update $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this ran: put the data commit on top of it. This commit
          # holds only data files, so where both sides changed one (data/lastmod.json after a code
          # push), keep this run's version: it matches the site that was just published.
          git pull --rebase -X theirs -q
          git push || { git pull --rebase -X theirs -q && git push; }
